server {
    listen 80;

    # Comprimir o que vai para o navegador: o JavaScript passa de 725 KB
    # para cerca de 210 KB, o que se nota sobretudo no telemovel
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml text/javascript
               image/svg+xml;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Os ficheiros em /static/ levam o numero da versao no nome: podem ser
    # guardados para sempre, porque um ficheiro novo tem outro nome
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A pagina principal aponta para esses ficheiros, por isso nunca pode
    # ficar guardada: senao o navegador continua a carregar a versao antiga
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri /index.html;
    }
}
